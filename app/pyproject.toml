[project]
name = "handbrake-tuner"
version = "0.1.0"
description = "Calibration app for the simracing handbrake"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "flask>=3.0",
]

[project.optional-dependencies]
# Native window. Without this extra, the app falls back to the browser by
# default: handy for troubleshooting, and avoids imposing pywebview's system
# dependencies (WebKitGTK on Linux) on those who do not want them.
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
handbrake-tuner = "handbrake_tuner.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["handbrake_tuner*"]

[tool.setuptools.package-data]
handbrake_tuner = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
