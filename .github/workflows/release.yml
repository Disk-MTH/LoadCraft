name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      # Without this mapping, downstream jobs see an empty
      # needs.gate.outputs.version and name the artifacts "LoadCraft--*".
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the pyproject version
        id: check
        run: |
          pyver=$(sed -n 's/^version = "\(.*\)"/\1/p' app/pyproject.toml)
          tag=${GITHUB_REF_NAME#v}
          if [ "$pyver" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the pyproject version $pyver"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the app with its test extra
        run: |
          python -m pip install --upgrade pip
          # The local path (./app) is mandatory: bare "app" resolves to an
          # unrelated third-party package on PyPI.
          python -m pip install "./app[dev]"
      - name: Firmware core tests (native)
        run: make -C tests test
      - name: App tests (pytest)
        run: python -m pytest app/tests -q

  firmware:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        # Pinned version, downloaded directly: the install script on the
        # master branch changed its CLI (-b is no longer a flag) and broke
        # the release builds.
        run: |
          curl -fsSL -o /tmp/arduino-cli.tar.gz \
            https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli
      - name: Install the AVR core and the Joystick library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL=true \
            arduino-cli lib install --git-url https://github.com/MHeironimus/ArduinoJoystickLibrary.git
      - name: Build the hex and the generated version files
        run: make build-hex RELEASE_VERSION="${{ needs.gate.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-data
          path: app/loadcraft/data/

  windows:
    runs-on: windows-latest
    needs: [gate, test, firmware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: app-data
          path: app/loadcraft/data/
      - name: Vendor the platform avrdude
        run: |
          mkdir -p app/loadcraft/data/avrdude
          cp dist-tools/avrdude/avrdude.exe dist-tools/avrdude/avrdude.conf app/loadcraft/data/avrdude/
      - name: Generate the app version file
        run: printf '"""Generated by CI - do not edit."""\n__version__ = "%s"\n' "${{ needs.gate.outputs.version }}" > app/loadcraft/_version.py
      - name: Install the build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller flask pyserial
      - name: Build the onefile exe
        run: |
          cd app
          pyinstaller --noconfirm --onefile --windowed --name LoadCraft \
            --paths . --exclude-module webview \
            --add-data "loadcraft/data;loadcraft/data" \
            --add-data "loadcraft/web;loadcraft/web" main.py
      - name: Publish the artifact
        run: |
          mkdir -p dist
          mv app/dist/LoadCraft.exe "dist/LoadCraft-${{ needs.gate.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: dist/LoadCraft-*.exe

  linux:
    runs-on: ubuntu-latest
    needs: [gate, test, firmware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: app-data
          path: app/loadcraft/data/
      - name: Vendor the platform avrdude
        run: |
          mkdir -p app/loadcraft/data/avrdude
          cp dist-tools/avrdude/avrdude dist-tools/avrdude/avrdude.conf app/loadcraft/data/avrdude/
      - name: Generate the app version file
        run: printf '"""Generated by CI - do not edit."""\n__version__ = "%s"\n' "${{ needs.gate.outputs.version }}" > app/loadcraft/_version.py
      - name: Install the build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller flask pyserial
      - name: Build the onedir bundle
        run: |
          cd app
          pyinstaller --noconfirm --onedir --name LoadCraft \
            --paths . --exclude-module webview \
            --add-data "loadcraft/data:loadcraft/data" \
            --add-data "loadcraft/web:loadcraft/web" main.py
      - name: Install appimagetool and libfuse
        # Retries: the GitHub release CDN intermittently answers 504.
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL -o /tmp/appimagetool \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            then ok=1; break; fi
            echo "download attempt $i failed, retrying in 20s..."
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "appimagetool download failed after 5 attempts"; exit 1; }
          chmod +x /tmp/appimagetool
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 2>/dev/null \
            || sudo apt-get install -y libfuse2
      - name: Assemble the AppImage
        run: |
          rm -rf LoadCraft.AppDir
          mkdir -p LoadCraft.AppDir/usr/bin
          cp -r app/dist/LoadCraft/. LoadCraft.AppDir/usr/bin/
          cp dist-tools/LoadCraft.desktop dist-tools/LoadCraft.png LoadCraft.AppDir/
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/LoadCraft" "$@"\n' > LoadCraft.AppDir/AppRun
          chmod +x LoadCraft.AppDir/AppRun
          /tmp/appimagetool LoadCraft.AppDir
      - name: Publish the artifact
        run: |
          mkdir -p dist
          mv LoadCraft-x86_64.AppImage "dist/LoadCraft-${{ needs.gate.outputs.version }}-linux.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/LoadCraft-*.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [gate, test, firmware, windows, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-exe
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist/
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LoadCraft-*-windows-x64.exe
            dist/LoadCraft-*-linux.AppImage
          body: |
            # LoadCraft ${{ needs.gate.outputs.version }}

            - `LoadCraft-${{ needs.gate.outputs.version }}-windows-x64.exe` (Windows 10/11 x64)
            - `LoadCraft-${{ needs.gate.outputs.version }}-linux.AppImage` (Linux x86_64)

            Install: copy the file and run it - there is no installer. On Windows, the first launch may show a SmartScreen warning: choose "More info", then "Run".

            Uninstall: delete the file.

            Bundled firmware: v${{ needs.gate.outputs.version }}, flashable from the in-app Firmware panel. The board's calibration EEPROM is not touched.
